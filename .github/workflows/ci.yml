name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The tenant-isolation policies are the whole security model, and they had
    # only ever run on PGlite. This also runs the real-Postgres project driver.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: power
          POSTGRES_PASSWORD: power
          POSTGRES_DB: power_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U power -d power_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POWER_TEST_DATABASE_URL: postgres://power:power@127.0.0.1:5432/power_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # The site reads the same tool registry and plan limits the server
      # enforces, so a drift between them fails the build here.
      - run: pnpm --filter @power/protocol build
      - run: pnpm build:site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: apps/site/out

  # The pipeline, end to end, through a real MCP client. Every gate, both human
  # approvals, the migration gate, the scrubber, and the ledger.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: start server
        working-directory: apps/mcp-server
        run: |
          # The e2e client presents no credential, so the server has to be the
          # loopback-only dev authenticator; without it every call is a 401 and
          # this job has never actually exercised the pipeline.
          PORT=4321 POWER_DEV_AUTH=1 POWER_DEV_LOGIN=1 POWER_DEPLOYER=local POWER_LOCAL_ROOT="$RUNNER_TEMP/power" nohup pnpm exec tsx src/index.ts > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 120); do curl -sf http://localhost:4321/health && break; sleep 0.5; done
      - name: e2e
        working-directory: apps/mcp-server
        run: POWER_BASE_URL=http://localhost:4321 pnpm exec tsx src/e2e.ts
      - name: server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"

  # The anti-lock-in promise, enforced: a project created by the server must
  # come up green from its own export, with nothing from Power on the path.
  export-runs-anywhere:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: create and export a project
        working-directory: apps/mcp-server
        run: |
          PORT=4321 POWER_DEV_AUTH=1 POWER_DEV_LOGIN=1 POWER_DEPLOYER=local POWER_LOCAL_ROOT="$RUNNER_TEMP/power" nohup pnpm exec tsx src/index.ts > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 120); do curl -sf http://localhost:4321/health && break; sleep 0.5; done
          POWER_BASE_URL=http://localhost:4321 pnpm exec tsx src/e2e.ts > /dev/null
          BUNDLE=$(ls "$RUNNER_TEMP"/power/exports/*.bundle | head -1)
          git clone "$BUNDLE" "$RUNNER_TEMP/exported"
      - name: the export runs on its own
        working-directory: ${{ runner.temp }}/exported
        run: |
          test -f .env.example && test -f docker-compose.yml
          cp .env.example .env
          pnpm install
          pnpm typecheck
          pnpm test
